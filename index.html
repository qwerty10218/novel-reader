<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>彼岸仍是人間</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/conversion-dict.js"></script>
</head>
<body class="theme-sepia font-sans scroll-mode">

    <!-- 工具列 -->
    <header id="topbar" class="toolbar">
        <button id="btn-menu" class="icon-btn" aria-label="章節目錄">☰</button>
        <div class="novel-title" id="topbar-title">彼岸仍是人間</div>
        <div class="toolbar-right">
            <button id="btn-lang" class="tool-btn" aria-label="繁簡轉換">繁</button>
            <button id="btn-font" class="tool-btn" aria-label="字型切換">黑</button>
            <button id="btn-page" class="tool-btn" aria-label="閱讀模式">滾</button>
            <button id="btn-fontsize" class="tool-btn" aria-label="字體大小">Aa</button>
            <button id="btn-audio" class="icon-btn" aria-label="聲音">🔊</button>
            <button id="btn-user" class="icon-btn" aria-label="我的閱讀">👤</button>
        </div>
    </header>

    <!-- 閱讀進度條 -->
    <div id="progress-container"><div id="progress-bar"></div></div>

    <!-- 翻頁點擊區（Page Mode 才顯示） -->
    <div id="zone-left" class="page-click-zone left" title="上一頁"></div>
    <div id="zone-right" class="page-click-zone right" title="下一頁"></div>

    <!-- 閱讀容器（Scroll Mode / Page Mode 共用） -->
    <main id="reader-container">
        <!-- Scroll Mode：顯示 article + bottom-nav -->
        <article id="reader-content">
            <div class="loading-state">載入中...</div>
        </article>

        <nav class="bottom-nav">
            <button id="btn-prev-chap" class="btn" disabled>上一章</button>
            <button id="btn-next-chap" class="btn">下一章</button>
        </nav>
    </main>

    <!-- 側邊章節目錄 -->
    <div id="drawer-menu" class="drawer" aria-label="目錄">
        <div class="drawer-header">
            <h3>目錄</h3>
            <button id="btn-close-menu" class="icon-btn">✕</button>
        </div>
        <div class="drawer-content" id="chapter-list"></div>
    </div>

    <!-- 聲音面板 (Audio Drawer) -->
    <div id="audio-panel" class="drawer" aria-label="聲音">
        <div class="drawer-header">
            <h3>聲音</h3>
            <button id="btn-close-audio" class="icon-btn">✕</button>
        </div>
        <div class="drawer-content audio-drawer-content">
            <div class="audio-tabs" role="tablist" aria-label="聲音分類">
                <button id="tab-tts" class="tab-btn active" type="button" role="tab" aria-selected="true">小說朗讀</button>
                <button id="tab-ost" class="tab-btn" type="button" role="tab" aria-selected="false">主題曲</button>
            </div>

            <div id="panel-tts" class="audio-panel-section" role="tabpanel" aria-labelledby="tab-tts">
                <div class="audio-controls">
                    <div class="audio-button-row">
                        <button id="btn-tts-play" class="btn audio-primary-btn" type="button">▶ 朗讀</button>
                        <button id="btn-tts-stop" class="btn audio-secondary-btn" type="button">■ 停止</button>
                    </div>
                    <div class="audio-option-row">
                        <label class="audio-check">
                            <input type="checkbox" id="tts-continuous"> 連續朗讀
                        </label>
                        <div class="audio-selects">
                            <select id="tts-voice-select" aria-label="朗讀聲線">
                                <option value="male">大叔音色</option>
                                <option value="female">成熟女聲</option>
                            </select>
                            <select id="tts-speed-select" aria-label="朗讀速度">
                                <option value="0.85">0.85x</option>
                                <option value="1.0" selected>1.0x</option>
                                <option value="1.15">1.15x</option>
                                <option value="1.3">1.3x</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="tts-progress-container" id="tts-progress-container" aria-label="朗讀進度">
                    <div class="tts-progress-bar-bg">
                        <div id="tts-progress-bar" class="tts-progress-bar-fill"></div>
                    </div>
                    <div class="tts-time-info">
                        <span id="tts-time-current">0:00</span>
                        <span id="tts-time-total">0:00</span>
                    </div>
                </div>

                <div id="tts-status" class="audio-status">未載入</div>
            </div>

            <div id="panel-ost" class="audio-panel-section" role="tabpanel" aria-labelledby="tab-ost" hidden>
                <section class="audio-card">
                    <div class="song-header">
                        <div>
                            <div class="song-title">主題曲：彼岸</div>
                            <div class="song-meta">閩南語正式成品</div>
                        </div>
                        <div class="segmented" aria-label="彼岸歌詞版本">
                            <button id="btn-bian-tw" class="active" type="button" data-lyric="tw">閩南語</button>
                            <button id="btn-bian-zh" type="button" data-lyric="zh">華語</button>
                        </div>
                    </div>

                    <div class="audio-button-row">
                        <button id="btn-ost-bian" class="btn audio-primary-btn" type="button">▶ 播放《彼岸》</button>
                    </div>

                    <div id="lyrics-bian" class="lyric-box">歌詞載入中...</div>
                </section>

                <section class="audio-card">
                    <div class="song-header">
                        <div>
                            <div class="song-title">主題曲：人間</div>
                            <div class="song-meta">國語歌曲</div>
                        </div>
                    </div>

                    <div class="audio-button-row">
                        <button id="btn-ost-renjian" class="btn audio-primary-btn" type="button">▶ 播放《人間》</button>
                    </div>

                    <div id="lyrics-renjian" class="lyric-box">歌詞載入中...</div>
                </section>

                <div class="media-progress" aria-label="主題曲播放進度">
                    <div id="ost-progress-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 首次進入：讀者暱稱輸入 -->
    <div id="login-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="login-title" style="display: none;">
        <div class="modal-header">
            <h3 id="login-title">歡迎閱讀</h3>
        </div>
        <div class="modal-content" style="text-align:center">
            <p style="margin-bottom:20px;color:var(--text-color);opacity:0.8;">
                請輸入你的讀者暱稱<br>
                <small style="font-size:0.85em;opacity:0.6;">系統會自動保存你的閱讀進度</small>
            </p>
            <input type="text" id="input-username" placeholder="例如：書友小明" maxlength="20"
                style="width:80%;padding:10px 14px;border:1px solid var(--border-color);border-radius:4px;font-size:1rem;background:transparent;color:var(--text-color);outline:none;margin-bottom:20px;text-align:center;">
            <br>
            <button id="btn-login" class="btn" style="width:80%;padding:12px;">開始閱讀</button>
        </div>
    </div>

    <!-- 我的閱讀面板 -->
    <div id="user-modal" class="modal" style="display: none;" role="dialog" aria-modal="true">
        <div class="modal-header">
            <h3>我的閱讀</h3>
            <button id="btn-close-user" class="icon-btn">✕</button>
        </div>
        <div class="modal-content">
            <div style="margin-bottom:20px">
                <strong>讀者：</strong>
                <span id="display-username">訪客</span>
            </div>
            <div style="margin-bottom:20px">
                <strong>同步狀態：</strong>
                <span id="display-sync-status" style="color:#6a994e">✓ 已同步</span>
            </div>
            <button id="btn-logout" class="btn" style="width:100%">更換暱稱</button>
        </div>
    </div>

    <!-- 遮罩 -->
    <div id="overlay" class="overlay"></div>

    <!-- 腳本 -->
    <script src="js/config.js"></script>
    <script src="js/audio-manager.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
