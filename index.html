<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>彼岸仍是人間</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="theme-sepia font-sans scroll-mode">

    <!-- 工具列 -->
    <header id="topbar" class="toolbar">
        <button id="btn-menu" class="icon-btn" aria-label="章節目錄">☰</button>
        <div class="novel-title" id="topbar-title">彼岸仍是人間</div>
        <div class="toolbar-right">
            <button id="btn-lang" class="tool-btn" aria-label="繁簡轉換">繁</button>
            <button id="btn-font" class="tool-btn" aria-label="字型切換">黑</button>
            <button id="btn-page" class="tool-btn" aria-label="閱讀模式">滾</button>
            <button id="btn-fontsize" class="tool-btn" aria-label="字體大小">Aa</button>
            <button id="btn-user" class="icon-btn" aria-label="我的閱讀">👤</button>
        </div>
    </header>

    <!-- 閱讀進度條 -->
    <div id="progress-container"><div id="progress-bar"></div></div>

    <!-- 翻頁點擊區（Page Mode 才顯示） -->
    <div id="zone-left" class="page-click-zone left" title="上一頁"></div>
    <div id="zone-right" class="page-click-zone right" title="下一頁"></div>

    <!-- 閱讀容器（Scroll Mode / Page Mode 共用） -->
    <main id="reader-container">
        <!-- Scroll Mode：顯示 article + bottom-nav -->
        <article id="reader-content">
            <div class="loading-state">載入中...</div>
        </article>
        <nav class="bottom-nav">
            <button id="btn-prev-chap" class="btn">上一章</button>
            <button id="btn-next-chap" class="btn">下一章</button>
        </nav>
        <!-- Page Mode：book-view 會由 JS 動態插入此容器 -->
    </main>

    <!-- 側邊章節目錄 -->
    <div id="drawer-menu" class="drawer">
        <div class="drawer-header">
            <h3>目錄</h3>
            <button id="btn-close-menu" class="icon-btn">✕</button>
        </div>
        <div class="drawer-content" id="chapter-list"></div>
    </div>

    <!-- 首次進入：讀者暱稱輸入 -->
    <div id="login-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="login-title" style="display: none;">
        <div class="modal-header">
            <h3 id="login-title">歡迎閱讀</h3>
        </div>
        <div class="modal-content" style="text-align:center">
            <p style="margin-bottom:20px;color:var(--text-color);opacity:0.8;">
                請輸入你的讀者暱稱<br>
                <small style="font-size:0.85em;opacity:0.6;">系統會自動保存你的閱讀進度</small>
            </p>
            <input type="text" id="input-username" placeholder="例如：書友小明" maxlength="20"
                style="width:80%;padding:10px 14px;border:1px solid var(--border-color);border-radius:4px;font-size:1rem;background:transparent;color:var(--text-color);outline:none;margin-bottom:20px;text-align:center;">
            <br>
            <button id="btn-login" class="btn" style="width:80%;padding:12px;">開始閱讀</button>
        </div>
    </div>

    <!-- 我的閱讀面板 -->
    <div id="user-modal" class="modal" style="display: none;" role="dialog" aria-modal="true">
        <div class="modal-header">
            <h3>我的閱讀</h3>
            <button id="btn-close-user" class="icon-btn">✕</button>
        </div>
        <div class="modal-content">
            <div style="margin-bottom:20px">
                <strong>讀者：</strong>
                <span id="display-username">訪客</span>
            </div>
            <div style="margin-bottom:20px">
                <strong>同步狀態：</strong>
                <span id="display-sync-status" style="color:#6a994e">✓ 已同步</span>
            </div>
            <button id="btn-logout" class="btn" style="width:100%">更換暱稱</button>
        </div>
    </div>

    <!-- 遮罩 -->
    <div id="overlay" class="overlay"></div>

    <!-- 腳本 -->
    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
